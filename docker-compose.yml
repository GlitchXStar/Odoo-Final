services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: empay-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

  # Frontend (Nginx + Vite build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: empay-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
